<!DOCTYPE html>
<html lang="cat">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llista d'activitats</title>
  <link rel="stylesheet" href="style.css">
</head>


<body>

  <header>
  <nav class="navbarPare" id="menuPrincipal">
    <h3>Menú</h3>
    <ul>
      <li><a href="index.html">Llista d'activitats</a></li>
      <li><a href="crear-tasca.html">Crear Tasca</a></li>
      <li><a href="categories.html">Gestió de categories</a></li>
    </ul>
  </nav>
</header>

  <main class="principal">
  <section class="seccioTitolPrincipal">
    <h2>Llistat d'Activitats</h2>
  </section>

  <section class="seccioAccionsPare">
    <button class="novaTascaBoto" onclick="location.href ='crear-tasca.html'">Crea Tasca</button>
    <div class="seccioImpJson">
      <label for="inputTasca">Cerca JSON:</label>
      <input type="text" id="inputTasca" placeholder="activitats.json">
      <button class="botoArxiuPujar">Pujar</button>
    </div>
  </section>



    <!--Llista dinàmica per tasques pendents-->

    <section class="seccioPendentsPare">
    <h3>TASQUES PENDENTS</h3>
    <table id="pendent">
      <thead><tr><th></th><th></th></tr></thead>
      <tbody id="llistaPendents"></tbody>
    </table>
  </section>


     <section class="seccioAcabadesPare">
      <h3>TASQUES ACABADES</h3>
      <table id="acabat">
        <tbody id="llistaAcabades"></tbody>
      </table>
      
      <div class="grafic-container">
        <canvas id="myChart"></canvas>
      </div>
    </section>

  </main> 

 
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script>
    // És millor moure això a un fitxer js/main.js
    const ctx = document.getElementById('myChart');

    if (ctx) {
      new Chart(ctx, {
        type: 'line',
        data: {
          
          labels: ['Gener', 'Febrer', 'Març', 'Abril', 'Maig', 'Juny', 'Juliol', 'Agost', 'Setembre', 'Octubre', 'Novembre', 'Desembre'],
          datasets: [{
            label: 'Completades',
            data: [], // comptadors de JS
            borderWidth: 2
          }]
        }
      });
    }
  </script>

</body>
</html>
